<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
  <style>
    .main{
      width: 100%;
      min-height: 1200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    textarea{
      width:40vw;
      height: 200px;
      padding: 10px;
      font-size: 24px;
      border: 1px solid black;
      outline-color: royalblue;
      border-radius: 10px;
    }
    input {
      width: 40vw;
      padding: 10px;
      font-size: 24px;
      border: 1px solid black;
      outline-color: royalblue;
      border-radius: 10px;
    }

    .profiles{
      width: 40vw;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .profile img{
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    #clearButton{
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      background-color: royalblue;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .progress-bar{
      position: fixed;
      top: 0;
      left: 0;
      height: 5px;
      background-color: royalblue;
      width: 0%;
    }
    
  </style>
</head>
<body>
  <div class="main">
   <div class="progress-bar"></div>
    
  </div>
  <script src="index.js"></script>
</body>
</html>
