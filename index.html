<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
  <style>
    .main{
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    textarea{
      width:40vw;
      height: 200px;
      padding: 10px;
      font-size: 24px;
      border: 1px solid black;
      outline-color: royalblue;
      border-radius: 10px;
    }
    input {
      width: 40vw;
      padding: 10px;
      font-size: 24px;
      border: 1px solid black;
      outline-color: royalblue;
      border-radius: 10px;
    }

    .profiles{
      width: 40vw;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .profile img{
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    #clearButton{
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      background-color: royalblue;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    
  </style>
</head>
<body>
  <div class="main">
    <input type="number" id="maxChars" placeholder="type max limit of chars..." >
    <div>
      <h3>Chars Count : <span id="textCount">0</span>/<span id="maxCharsDisplay">100</span></h3>
      <textarea name="" id="contentArea" placeholder="put your comment ..."></textarea> <br>
    <button id="clearButton">Clear all</button>

    </div>
    
  </div>
  <script src="index.js"></script>
</body>
</html>
