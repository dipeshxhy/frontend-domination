<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
  <style>
    .main{
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .progressBar{
      width: 80%;
      height: 20px;
      background-color: #eee;
      margin: 20px auto;
      border-radius: 100px;
      transition:all 0.3s linear;
    }
    .progress{
      transition:all 0.3s linear;

      width: 0%;
      height: 100%;
      background-color: #007bff;
      border-radius: 100px;
    }
  </style>
</head>
<body>
  <div class="main">
    <h2 class="textProgress"></h2>
    <div class="progressBar">
      <div class="progress"></div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
