<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
  <style>
    .main{
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    input{
      width:40vw;
      padding: 10px;
      font-size: 24px;
      border: 1px solid black;
      outline-color: royalblue;
      border-radius: 10px;
    }

    .profiles{
      width: 40vw;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .profile img{
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    
  </style>
</head>
<body>
  <div class="main">
    <div>
      <input type="text" placeholder="search by name ...">
    </div>
    <div class="profiles">
      
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
